## Universal Agent server (agentd) + standalone web chat UI.
##
## Start:            AGENTD_AUTH_TOKEN=<token> docker compose up --build
## With Postgres:    AGENTD_AUTH_TOKEN=<token> AGENTD_PG_URL=postgresql://agent:agent@postgres:5432/agent \
##                   docker compose --profile postgres up --build
##                   (and set the agentd profile store backend to postgres with url_env=AGENTD_PG_URL)
## agentd: http://localhost:8765     web: http://localhost:8080
services:
  agentd:
    build: .
    container_name: universal-agent-agentd
    ports:
      - "8765:8765"
    environment:
      AGENTD_AUTH_TOKEN: ${AGENTD_AUTH_TOKEN:?set AGENTD_AUTH_TOKEN before starting agentd}
      AGENTD_PG_URL: ${AGENTD_PG_URL:-}
    volumes:
      - agent-data:/data
      - agent-config:/config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped

  web:
    build: ./web
    container_name: universal-agent-web
    ports:
      - "8080:8080"
    environment:
      AGENTD_URL: http://agentd:8765
      AGENTD_TOKEN: ${AGENTD_AUTH_TOKEN:?set AGENTD_AUTH_TOKEN before starting agentd}
    depends_on:
      - agentd
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped

  # Optional durable store: enable with `--profile postgres` and set the
  # agentd profile store backend to {"backend": "postgres",
  # "url_env": "AGENTD_PG_URL"}.
  postgres:
    image: postgres:16-alpine
    container_name: universal-agent-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  agent-data:
  agent-config:
  pg-data:
