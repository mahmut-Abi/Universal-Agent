name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,all]'

      # Format/lint/type gates run once on the primary version; test runs on
      # every matrix leg so behavior is verified across the supported range.
      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: python -m ruff format --check src tests examples

      - name: Lint
        if: matrix.python-version == '3.12'
        run: python -m ruff check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

      # Report-only coverage baseline (86% branch at introduction); no
      # enforcement gate until per-module baselines are agreed.
      - name: Coverage report
        if: matrix.python-version == '3.12'
        run: python -m pytest -q --cov --cov-report=term --cov-report=json

      - name: Report test behavior/contract/unit ratio
        if: matrix.python-version == '3.12'
        run: python scripts/report-test-ratio.py

  container:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t universal-agent-runtime:ci .

      - name: Smoke test agentd container runtime
        env:
          # Generated per-run so the token never lives in workflow logs or
          # the repository; mounted via --env-file instead of -e on the
          # command line.
          AGENTD_AUTH_TOKEN: ${{ secrets.AGENTD_SMOKE_AUTH_TOKEN || format('ci-smoke-{0}', github.run_id) }}
        run: |
          printf 'AGENTD_AUTH_TOKEN=%s\n' "$AGENTD_AUTH_TOKEN" > agentd-smoke.env
          docker run -d --name agentd-smoke -p 8765:8765 \
            --env-file agentd-smoke.env \
            universal-agent-runtime:ci
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ready > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs agentd-smoke
            echo "agentd container did not become ready" >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/health
          docker exec agentd-smoke test -f /config/profile.json
          docker rm -f agentd-smoke
          rm -f agentd-smoke.env

  kubernetes-live-contract:
    name: Kubernetes live contract
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    if: "${{ github.event_name == 'push' &&
      vars.UNIVERSAL_AGENT_LIVE_KUBERNETES_ENABLED == 'true' }}"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KUBERNETES_API_TOKEN: ${{ secrets.KUBERNETES_API_TOKEN }}
      UNIVERSAL_AGENT_LIVE_KUBERNETES_PROFILE: >-
        .universal-agent/live-contract/profile.json
      UNIVERSAL_AGENT_LIVE_KUBERNETES_PROFILE_NAME: >-
        ${{ vars.UNIVERSAL_AGENT_LIVE_KUBERNETES_PROFILE_NAME || 'production-operator' }}
      UNIVERSAL_AGENT_LIVE_KUBERNETES_WORKLOAD: ${{ vars.UNIVERSAL_AGENT_LIVE_KUBERNETES_WORKLOAD }}
      UNIVERSAL_AGENT_LIVE_KUBERNETES_NAMESPACE: ${{ vars.UNIVERSAL_AGENT_LIVE_KUBERNETES_NAMESPACE }}
      UNIVERSAL_AGENT_LIVE_KUBERNETES_RUN: ${{ vars.UNIVERSAL_AGENT_LIVE_KUBERNETES_RUN || 'false' }}
      UNIVERSAL_AGENT_LIVE_KUBERNETES_ARTIFACT_DIR: >-
        .universal-agent/live-contract/artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,all]'

      - name: Prepare live profile
        env:
          PROFILE_CONFIG_B64: ${{ secrets.UNIVERSAL_AGENT_LIVE_KUBERNETES_PROFILE_B64 }}
          KUBECONFIG_B64: ${{ secrets.UNIVERSAL_AGENT_LIVE_KUBECONFIG_B64 }}
        run: |
          test -n "$PROFILE_CONFIG_B64"
          mkdir -p .universal-agent/live-contract
          printf '%s' "$PROFILE_CONFIG_B64" | base64 --decode \
            > "$UNIVERSAL_AGENT_LIVE_KUBERNETES_PROFILE"
          if [ -n "$KUBECONFIG_B64" ]; then
            printf '%s' "$KUBECONFIG_B64" | base64 --decode > .universal-agent/live-contract/kubeconfig
            echo "KUBECONFIG=$PWD/.universal-agent/live-contract/kubeconfig" \
              >> "$GITHUB_ENV"
          fi

      - name: Run live Kubernetes contract
        run: python -m pytest -q tests/live/test_kubernetes_live_operator.py

      - name: Upload live contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-live-contract
          path: .universal-agent/live-contract/artifacts
          if-no-files-found: ignore
