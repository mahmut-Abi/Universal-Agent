<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Agent Web — Sign in</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      body { display: flex; align-items: center; justify-content: center; }
      .login-card {
        width: 320px;
        padding: 28px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .login-card h1 { font-size: 18px; margin: 0; }
      .login-card input {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        padding: 10px 12px;
        font-size: 14px;
      }
      .login-card input:focus { outline: 1px solid var(--accent); }
      .login-error { color: var(--err); font-size: 13px; display: none; }
    </style>
  </head>
  <body>
    <form class="login-card" method="post" action="/login">
      <h1>Universal Agent Web</h1>
      <p class="muted" style="margin: 0;">Enter the deployment password to continue.</p>
      <input type="password" name="password" placeholder="Password" autofocus required />
      <button class="primary" type="submit">Sign in</button>
      <div class="login-error" id="login-error">Invalid password.</div>
    </form>
    <script>
      if (window.location.search.includes("error=1")) {
        document.getElementById("login-error").style.display = "block";
      }
    </script>
  </body>
</html>
