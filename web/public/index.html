<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Agent — Chat</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="brand">Universal Agent</span>
        <button id="new-chat" class="primary" type="button" title="Start a new goal">＋ New chat</button>
        <input
          id="session-search"
          type="search"
          placeholder="Search sessions…"
          autocomplete="off"
        />
      </div>
      <ul id="session-list" aria-label="Sessions"></ul>
      <div class="sidebar-footer" id="server-status">checking server…</div>
    </aside>

    <main id="main">
      <header id="chat-header">
        <span id="chat-title">Select or create a chat</span>
        <span id="chat-status" class="status-badge hidden"></span>
        <span class="spacer"></span>
        <button id="btn-pause" class="ghost hidden" type="button">Pause</button>
        <button id="btn-cancel" class="danger ghost hidden" type="button">Cancel</button>
      </header>

      <nav id="detail-tabs" class="hidden">
        <button class="tab active" data-tab="chat" type="button">Chat</button>
        <button class="tab" data-tab="timeline" type="button">Timeline</button>
        <button class="tab" data-tab="evidence" type="button">Evidence</button>
        <button class="tab" data-tab="world" type="button">World</button>
      </nav>
      <section id="transcript" aria-live="polite"></section>
      <section id="detail" class="hidden"></section>

      <div id="confirmation" class="confirmation hidden">
        <div>
          <strong id="confirm-title"></strong>
          <div id="confirm-detail" class="muted"></div>
        </div>
        <div class="confirm-actions">
          <button id="btn-confirm" class="primary" type="button">Confirm</button>
          <button id="btn-reject" class="danger" type="button">Reject</button>
        </div>
      </div>

      <form id="composer" autocomplete="off">
        <textarea
          id="goal-input"
          rows="2"
          placeholder="Describe a goal for the agent… (Enter to send, Shift+Enter for a newline)"
        ></textarea>
        <button id="btn-send" class="primary" type="submit">Send</button>
      </form>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
