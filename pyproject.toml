[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-agent-runtime"
version = "0.1.0"
description = "A minimal universal agent runtime with runtime-owned state and control flow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Universal Agent Runtime contributors" }]
dependencies = [
  "filelock>=3.15,<4",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonlines>=4,<5",
  "jsonschema>=4.23,<5",
  "junit-xml>=1.9,<2",
  "openai>=1.99,<3",
  "opentelemetry-proto>=1.28,<2",
  "orjson>=3.10,<4",
  "packaging>=24,<27",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.9,<4",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.37,<1",
  "tenacity>=9,<10",
  "textual>=3.0",
  "uvicorn>=0.30,<1",
]

[project.scripts]
agent = "universal_agent_cli.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "types-python-dateutil>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
  "types-protobuf>=6,<8",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/universal_agent",
  "src/universal_agent_api",
  "src/universal_agent_cli",
  "src/universal_agent_tui",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: tests that contact external model providers or Kubernetes clusters",
  "behavior: tests that assert on real agent runtime outcomes (goal/task completion, world model, policy, recovery, evaluation)",
  "contract: tests that assert on payload/serialization/view round-trip shape rather than agent behavior",
  "unit: internal unit tests of helpers, parsers, config, and pure logic that are neither behavior nor contract",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]

[dependency-groups]
dev = [
    "types-python-dateutil>=2.9,<3",
]
