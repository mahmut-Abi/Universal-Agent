[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-agent-runtime"
version = "0.1.0"
description = "A minimal universal agent runtime with runtime-owned state and control flow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Universal Agent Runtime contributors" }]
dependencies = [
  "filelock>=3.15,<4",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "opentelemetry-proto>=1.28,<2",
  "packaging>=24,<27",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
  "starlette>=0.37,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
agent = "universal_agent.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
  "types-protobuf>=6,<8",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/universal_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: tests that contact external model providers or Kubernetes clusters",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]
