[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-agent-runtime"
version = "0.1.0"
description = "A minimal universal agent runtime with runtime-owned state and control flow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Universal Agent Runtime contributors" }]
dependencies = [
  "filelock>=3.15,<4",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonlines>=4,<5",
  "jsonschema>=4.23,<5",
  "junit-xml>=1.9,<2",
  "opentelemetry-proto>=1.28,<2",
  "orjson>=3.10,<4",
  "packaging>=24,<27",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.9,<4",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
]

# Provider/UI/store integrations are optional extras; the kernel imports them
# lazily so the Golden Path (scripted model, file/sqlite stores, no UI) works
# with the core dependencies only. opentelemetry-proto and prometheus-client
# stay core: observability exports are P3.6 runtime scope and both packages
# are small, pure-Python wheels.
[project.optional-dependencies]
# agentd Runtime server (HTTP API + Web Console). Personal/Golden Path use
# never needs it; `ua serve` / `agentd` require this extra.
server = ["starlette>=0.37,<1", "uvicorn>=0.30,<1"]
openai = ["openai>=1.99,<3"]
tui = ["textual>=3.0"]
postgres = ["psycopg[binary]>=3.2,<4"]
all = ["universal-agent-runtime[server,openai,tui,postgres]"]
# Dev tooling, installed by pip via `.[dev]`; keep in sync with the
# [dependency-groups].dev table at the bottom of this file.
dev = [
  "mypy>=1.11,<2",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3.8,<4",
  # The test suite exercises the agentd server surface; keep the server
  # extra installed in every dev environment.
  "starlette>=0.37,<1",
  "uvicorn>=0.30,<1",
  "types-python-dateutil>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff==0.16.4",
  "types-jsonschema>=4.23,<5",
  "types-protobuf>=6,<8",
  "types-PyYAML>=6,<7",
]

[project.scripts]
agent = "universal_agent_cli:main"
ua = "universal_agent_cli:main"

# Domain-contributed host surfaces (AGENTS.md §11): the CLI/agentd hosts
# discover these via entry points and never import a concrete domain.
[project.entry-points."universal_agent.agentd_routes"]
kubernetes = "universal_agent.domains.kubernetes.agentd_routes:kubernetes_agentd_contribution"
workspace = "universal_agent.domains.workspace.agentd_routes:workspace_agentd_contribution"

[project.entry-points."universal_agent.cli_contributions"]
kubernetes = "universal_agent.domains.kubernetes.registration:kubernetes_cli_contribution"
local = "universal_agent.domains.local.registration:local_cli_contribution"
workspace = "universal_agent.domains.workspace.registration:workspace_cli_contribution"

[project.entry-points."universal_agent.default_domains"]
local = "universal_agent.domains.local.cli_runtime:build_local_service"
kubernetes = "universal_agent.domains.kubernetes.cli_runtime:build_default_service"
workspace = "universal_agent.domains.workspace.cli_runtime:build_default_workspace_service"

[project.entry-points."universal_agent.evaluation_suites"]
kubernetes = "universal_agent.domains.kubernetes.eval_suite:build_kubernetes_evaluation_suite"
workspace = "universal_agent.domains.workspace.eval_suite:build_workspace_evaluation_suite"

[tool.hatch.build.targets.wheel]
packages = [
  "src/universal_agent",
  "src/universal_agent_api",
  "src/universal_agent_cli",
  "src/universal_agent_tui",
]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
  # Fail loudly on deprecations (e.g. Python 3.16 removals) instead of letting
  # them accumulate silently until a future Python upgrade breaks the suite.
  "error::DeprecationWarning",
  # starlette.testclient evaluates the `anyio.abc.BlockingPortal` alias in a
  # module-level type alias; anyio 4.15.0 deprecated that alias and starlette
  # <1 has not switched to anyio.from_thread.BlockingPortal yet. The warning
  # fires at collection time in CI's fresh pip resolution, so ignore exactly
  # this third-party message until upstream fixes it.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
testpaths = ["tests"]
markers = [
  "integration: integration tests over runtime/service/CLI/HTTP seams",
  "live: tests that contact external model providers or Kubernetes clusters",
  "behavior: tests that assert on real agent runtime outcomes (goal/task completion, world model, policy, recovery, evaluation)",
  "contract: tests that assert on payload/serialization/view round-trip shape rather than agent behavior",
  "unit: internal unit tests of helpers, parsers, config, and pure logic that are neither behavior nor contract",
]

[tool.coverage.run]
source = [
  "src/universal_agent",
  "src/universal_agent_api",
  "src/universal_agent_cli",
  "src/universal_agent_tui",
]
branch = true

[tool.coverage.report]
# Ratchet gate (UA-AUDIT-006): fail_under is the documented baseline, measured
# at 86.7% combined line+branch coverage on 2026-09-15 (25.9k statements).
# Raise it when coverage improves; never lower it. Local runs bypass the gate
# with `--cov-fail-under=0` if needed.
fail_under = 86
show_missing = false
skip_empty = true
precision = 1

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The legacy compatibility lookup in the root facade is a generated table;
# keeping each "name": "module.attr" mapping on one reviewable line beats
# wrapping long dotted paths across multiple lines.
"src/universal_agent/__init__.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]

# uv installs [dependency-groups] on a bare `uv sync`; keep this dev group in
# sync with [project.optional-dependencies].dev above plus every extra the
# test suite imports (openai, tui, postgres) so both install paths produce a
# complete test environment. CI installs `.[dev,all]` via pip.
[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "openai>=1.99,<3",
  "psycopg[binary]>=3.2,<4",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3.8,<4",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff==0.16.4",
  # Server extra: the test suite exercises the agentd HTTP surface.
  "starlette>=0.37,<1",
  "textual>=3.0",
  "uvicorn>=0.30,<1",
  "types-jsonschema>=4.23,<5",
  "types-protobuf>=6,<8",
  "types-PyYAML>=6,<7",
  "types-python-dateutil>=2.9,<3",
]
